name: Facets
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"

configFiles:
  Debug: Config/Facets.xcconfig
  Release: Config/Facets.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  MeshKit:
    path: Packages/MeshKit

targets:
  Facets:
    type: application
    platform: iOS
    sources:
      - path: Facets
    dependencies:
      - package: MeshKit
      - target: FacetsPreview
      - target: FacetsThumbnail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FACETS_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Settings › App Icon offers these. The icons are Icon Composer documents
        # built by tools/icons/build_icons.py.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Wireframe AppIcon-Mesh
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    info:
      path: Facets/Info.plist
      properties:
        CFBundleDisplayName: Facets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The library folder shows up in the Files app, and files open where they are.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: STL Model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.standard-tesselated-geometry-format
          - CFBundleTypeName: 3MF Model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - com.bambulab.3mf
        # Neither format is ours, so both are imported. STL is declared by the system;
        # 3MF has no system type, and Bambu Studio's identifier is the one other apps
        # on Apple platforms already use.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: public.standard-tesselated-geometry-format
            UTTypeDescription: STL Model
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - stl
              public.mime-type:
                - model/stl
                - application/sla
          - UTTypeIdentifier: com.bambulab.3mf
            UTTypeDescription: 3MF Model
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - 3mf
              public.mime-type:
                - model/3mf
                - application/vnd.ms-package.3dmanufacturing-3dmodel+xml

  FacetsPreview:
    type: app-extension
    platform: iOS
    sources:
      - path: FacetsPreview
    dependencies:
      - package: MeshKit
      - sdk: QuickLook.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FACETS_BUNDLE_ID).preview
    info:
      path: FacetsPreview/Info.plist
      properties:
        CFBundleDisplayName: Facets Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - public.standard-tesselated-geometry-format
              - com.bambulab.3mf

  FacetsThumbnail:
    type: app-extension
    platform: iOS
    sources:
      - path: FacetsThumbnail
    dependencies:
      - package: MeshKit
      - sdk: QuickLookThumbnailing.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FACETS_BUNDLE_ID).thumbnail
    info:
      path: FacetsThumbnail/Info.plist
      properties:
        CFBundleDisplayName: Facets Thumbnails
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLThumbnailMinimumDimension: 0
            QLSupportedContentTypes:
              - public.standard-tesselated-geometry-format
              - com.bambulab.3mf

schemes:
  Facets:
    build:
      targets:
        Facets: all
    run:
      config: Debug
    archive:
      config: Release
