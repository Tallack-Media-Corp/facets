name: Facets
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"

configFiles:
  Debug: Config/Facets.xcconfig
  Release: Config/Facets.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"

packages:
  MeshKit:
    path: Packages/MeshKit

targets:
  Facets:
    type: application
    platform: iOS
    sources:
      - path: Facets
      - path: Shared
    dependencies:
      - package: MeshKit
      - target: FacetsPreview
      - target: FacetsThumbnail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FACETS_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Settings › App Icon offers these. The icons are Icon Composer documents
        # built by tools/icons/build_icons.py.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Mesh
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    info:
      path: Facets/Info.plist
      properties:
        CFBundleDisplayName: Facets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The library folder shows up in the Files app, and files open where they are.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: STL Model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.standard-tesselated-geometry-format
          - CFBundleTypeName: 3MF Model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - com.bambulab.3mf
          - CFBundleTypeName: OBJ Model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.geometry-definition-format
        # None of the formats is ours, so all are imported. STL and OBJ are declared by
        # the system; 3MF has no system type, and Bambu Studio's identifier is the one
        # other apps on Apple platforms already use.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: public.standard-tesselated-geometry-format
            UTTypeDescription: STL Model
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - stl
              public.mime-type:
                - model/stl
                - application/sla
          - UTTypeIdentifier: com.bambulab.3mf
            UTTypeDescription: 3MF Model
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - 3mf
              public.mime-type:
                - model/3mf
                - application/vnd.ms-package.3dmanufacturing-3dmodel+xml
          - UTTypeIdentifier: public.geometry-definition-format
            UTTypeDescription: OBJ Model
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - obj
              public.mime-type:
                - model/obj

  FacetsPreview:
    type: app-extension
    platform: iOS
    sources:
      - path: FacetsPreview
      - path: Shared
    dependencies:
      - package: MeshKit
      - sdk: QuickLook.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FACETS_BUNDLE_ID).preview
    info:
      path: FacetsPreview/Info.plist
      properties:
        CFBundleDisplayName: Facets Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - public.standard-tesselated-geometry-format
              - com.bambulab.3mf
              - public.geometry-definition-format

  FacetsThumbnail:
    type: app-extension
    platform: iOS
    sources:
      - path: FacetsThumbnail
    dependencies:
      - package: MeshKit
      - sdk: QuickLookThumbnailing.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FACETS_BUNDLE_ID).thumbnail
    info:
      path: FacetsThumbnail/Info.plist
      properties:
        CFBundleDisplayName: Facets Thumbnails
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLThumbnailMinimumDimension: 0
            QLSupportedContentTypes:
              - public.standard-tesselated-geometry-format
              - com.bambulab.3mf
              - public.geometry-definition-format

  # The Mac app: the same sources against the macOS SDK, under the same bundle id as
  # a macOS build of the same App Store record (universal purchase). Platform
  # differences go through Facets/UI/Platform.swift and #if os(macOS).
  FacetsMac:
    type: application
    platform: macOS
    sources:
      - path: Facets
        excludes:
          # Copied as a resource, App Store Connect reads it as a second bundle.
          - Info.plist
      - path: Shared
    dependencies:
      - package: MeshKit
    settings:
      base:
        PRODUCT_NAME: Facets
        PRODUCT_BUNDLE_IDENTIFIER: $(FACETS_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: FacetsMac/FacetsMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: FacetsMac/Info.plist
      properties:
        CFBundleDisplayName: Facets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: STL Model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.standard-tesselated-geometry-format
          - CFBundleTypeName: 3MF Model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - com.bambulab.3mf
          - CFBundleTypeName: OBJ Model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.geometry-definition-format
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: public.standard-tesselated-geometry-format
            UTTypeDescription: STL Model
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - stl
              public.mime-type:
                - model/stl
                - application/sla
          - UTTypeIdentifier: com.bambulab.3mf
            UTTypeDescription: 3MF Model
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - 3mf
              public.mime-type:
                - model/3mf
                - application/vnd.ms-package.3dmanufacturing-3dmodel+xml
          - UTTypeIdentifier: public.geometry-definition-format
            UTTypeDescription: OBJ Model
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - obj
              public.mime-type:
                - model/obj

schemes:
  FacetsMac:
    build:
      targets:
        FacetsMac: all
    run:
      config: Debug
    archive:
      config: Release
  Facets:
    build:
      targets:
        Facets: all
    run:
      config: Debug
    archive:
      config: Release
